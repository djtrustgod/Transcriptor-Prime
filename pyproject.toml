[project]
name = "transcriptor-prime"
version = "2.0.0"
description = "Local audio/video transcription GUI with periodic timecodes"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: runs a real Whisper or speaker model; downloads weights on first use",
]
